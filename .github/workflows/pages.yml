# Publishes every question as JSON on GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# The site then lives at https://ovo-amo.github.io/NAH-Bot/ (index.json, questions/<code>.json).
name: Publish questions to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "questions/**"
      - "scripts/build-pages.ts"
      - "scripts/lib/**"
      - "supabase/functions/_shared/genera.ts"
      - "supabase/functions/_shared/csv.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build JSON site
        run: deno run --allow-read --allow-write scripts/build-pages.ts dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
