# Supabase pauses Free-plan projects after a week without database activity.
# This pings the bot's /health route (which runs a real query) once a day.
#
# Caveat: GitHub disables scheduled workflows in public repositories after 60
# days without any commit, so this alone is not enough over a long summer.
# The README describes a second, independent ping (cron-job.org).
name: Keep Supabase awake

on:
  schedule:
    - cron: "23 9 * * *" # daily, 09:23 UTC (off the hour to avoid queue delays)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          url="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/discord-bot/health"
          curl --fail --silent --show-error --max-time 60 "$url"
          echo
